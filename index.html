<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BitGuard Security Spectrum - Audit Reports</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0f14;
            color: #ffffff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 25px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 36px;
        }

        .subtitle {
            color: #b8b8b8;
            margin-bottom: 40px;
            font-size: 18px;
        }

        .audit {
            display: block;
            padding: 22px;
            margin-bottom: 15px;
            background: #151b23;
            border: 1px solid #2a323d;
            border-radius: 10px;
            color: #ffffff;
            text-decoration: none;
        }

        .audit:hover {
            border-color: #d6a84f;
        }

        .network {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .description {
            color: #a8a8a8;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>BitGuard Security Spectrum</h1>

    <div class="subtitle">
        Smart Contract &amp; Token Security Audit Reports
    </div>

    <a class="audit" href="/smart-contract/BNB/">
        <div class="network">BNB Chain</div>
        <div class="description">
            BNBChain BitGuard Locker Audit Results
        </div>
    </a>

    <a class="audit" href="/smart-contract/CRONOS/">
        <div class="network">Cronos</div>
        <div class="description">
            CRONOS BitGuard Locker Audit Results
        </div>
    </a>

    <a class="audit" href="/smart-contract/POLYGON/">
        <div class="network">Polygon</div>
        <div class="description">
            POLYGON BitGuard Locker Audit Results
        </div>
    </a>

    <a class="audit" href="/smart-contract/SOLANA/">
        <div class="network">Solana</div>
        <div class="description">
            SOLANA BitGuard Locker Audit Results
        </div>
    </a>

</div>

</body>
</html>
